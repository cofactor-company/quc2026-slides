[build]
publish = "dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

[[redirects]]
from = "/macro-profiler/*"
to = "/macro-profiler/index.html"
status = 200

[[redirects]]
from = "/qgis-plugin-dev-workshop/*"
to = "/qgis-plugin-dev-workshop/index.html"
status = 200
